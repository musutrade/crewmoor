[package]
name = "crewmoor"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
uuid = { version = "1", features = ["v4"] }

tempfile = "3"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }

[dev-dependencies]
libc = "=0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.191"

[[bin]]
name = "transport-fixture"
path = "tests/support/transport.rs"

[[bin]]
name = "gh-fixture"
path = "tests/support/gh.rs"

[[bin]]
name = "opencode-fixture"
path = "tests/support/opencode.rs"
