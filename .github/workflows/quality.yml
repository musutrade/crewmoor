name: Quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gate-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest stable (no MSRV matrix)
        run: |
          rustup update stable --no-self-update
          rustup component add --toolchain stable clippy rustfmt llvm-tools-preview
          rustc +stable --version
          cargo +stable --version
      - name: Install coverage exporter
        run: cargo +stable install cargo-llvm-cov --version 0.9.0 --locked
      - name: Gate acceptance (positive, negative, boundary)
        run: python3 tools/quality/selftest.py
      - name: Business quality gate
        shell: bash
        run: |
          if test -f Cargo.toml; then
            python3 tools/quality/gate.py Cargo.toml
          else
            echo 'Business acceptance: N/A — no business Cargo.toml. Gate self-tests are separate.' >> "$GITHUB_STEP_SUMMARY"
          fi
