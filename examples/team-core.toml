# Issue #16 team in the user's existing App core. Copy and replace /absolute/project.
team = "sample-core-team"
task = "sample-task"
runtime = "core"
runtime_binary = "/home/gem/.local/bin/herdr-core"
runtime_version = "hc 0.1.17"
# Existing App/core target (see app-target.toml); filled from read-only confirmation.
# CrewMoor connects to that socket and never starts or stops the core.
app_target = "/absolute/crewmoor/app-target.toml"
# Must be the registry the user-level Hook callback was installed with.
feedback_registry = "/home/gem/.local/state/crewmoor/feedback"
evidence = "native"
dispatcher = "lead"

[[roles]]
# The user enters tasks directly in this returned terminal; no outer Agent is needed.
role = "lead"
cwd = "/absolute/project"
agent = "claude"
agent_executable = "/home/gem/.local/bin/claude"
agent_version = "2.1.318 (Claude Code)"
# Optional: one user-authorized startup prompt before bind, for any supported Agent.
# Single-line, <=4096 UTF-8 bytes; persisted in config/argv, so no secrets.
# initial_prompt = "Read the supplied initialization instructions."
# Optional: this role's own existing or new tab in app_target's EXISTING space_id.
# Omit to use the target tab_id, which may also be new. App adopts unknown tab IDs.
# A mistyped valid ID creates an extra tab; no tab precreation is required.
# tab_id = "tb-lead-tab-id"

[[roles]]
role = "worker"
cwd = "/absolute/project"
agent = "codex"
agent_executable = "/home/gem/.local/bin/codex"
agent_version = "codex-cli 0.166.0"
agent_args = ["--no-alt-screen"]
initial_prompt = "You are the worker. Wait for a team message before acting."
