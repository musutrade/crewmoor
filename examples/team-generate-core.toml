# Copy and choose all task/placement inputs; generate does not create an app-target.
team = "sample-core-team"
task = "sample-task"
runtime = "core"
app_target = "/absolute/existing-app-target.toml"
feedback_registry = "/absolute/feedback-registry"
evidence = "native"
dispatcher = "lead"

[[roles]]
role = "lead"
cwd = "/absolute/project"
agent = "claude"
agent_args = []
# Optional for any supported Agent: user-authorized, single-line, <=4096 UTF-8 bytes.
# Persisted in config and startup argv; no secrets. Omit for no startup text.
# initial_prompt = "Read the supplied initialization instructions."

[[roles]]
role = "worker"
cwd = "/absolute/project"
agent = "codex"
agent_args = ["--no-alt-screen"]
initial_prompt = "You are the worker. Wait for a crewmoor team assignment."
# Optional independent bound-downlink reminder; generated verbatim, never startup text.
# message_constraint = "Use the verification scope agreed for the current task."
