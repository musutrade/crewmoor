name: Quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest stable
        run: rustup update stable --no-self-update
      - name: Install toolchain components
        run: rustup component add --toolchain stable clippy rustfmt llvm-tools-preview
      - name: Compiler version
        run: rustc +stable --version
      - name: Cargo version
        run: cargo +stable --version
      - name: Install coverage exporter
        run: cargo +stable install cargo-llvm-cov --version 0.9.0 --locked
      - name: Rust quality acceptance and business gate
        run: cargo +stable run --locked --manifest-path tools/quality/Cargo.toml -- verify
