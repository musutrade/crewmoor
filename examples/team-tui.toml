# One dispatcher layer in the user's existing Herdr server. Replace paths/versions.
team = "sample-team"
task = "sample-task"
runtime = "tui"
runtime_binary = "/home/gem/.local/bin/herdr"
runtime_version = "herdr 0.9.5"
# Must be the registry the user-level Hook callback was installed with.
feedback_registry = "/home/gem/.local/state/crewmoor/feedback"
evidence = "native"
dispatcher = "lead"

[host]
socket = "/home/gem/.config/herdr/herdr.sock"
server_version = "0.9.5"

[[roles]]
# The user enters tasks directly in this returned pane; no outer Agent is needed.
role = "lead"
cwd = "/absolute/project"
agent = "claude"
agent_executable = "/home/gem/.local/bin/claude"
agent_version = "2.1.318 (Claude Code)"
# Optional: one user-authorized startup prompt before bind, for any supported Agent.
# Single-line, <=4096 UTF-8 bytes; persisted in config/argv, so no secrets.
# initial_prompt = "Read the supplied initialization instructions."

[[roles]]
role = "worker"
cwd = "/absolute/project"
agent = "codex"
agent_executable = "/home/gem/.local/bin/codex"
agent_version = "codex-cli 0.166.0"
agent_args = ["--no-alt-screen"]
initial_prompt = "You are the worker. Wait for a team message before acting."
# Optional original text after each accepted bound dispatcher message (not startup).
# <=16384 UTF-8 bytes; newlines allowed; persisted in team/binding/receipts, no secrets.
# Included in the same envelope addressed to this role; edit running team.json via team constraint.
# message_constraint = "Use the verification scope agreed for the current task."
