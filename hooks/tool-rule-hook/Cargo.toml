[package]
name = "tool-rule-hook"
version = "0.1.0"
edition = "2024"
publish = false
description = "Configurable static pre-tool engineering checks for native agent hooks"
readme = "README.md"
include = ["src/**", "tests/**", "assets/**", "assets/catalog/.agents/plugins/marketplace.json", "assets/plugin/.codex-plugin/plugin.json", "assets/plugin/.claude-plugin/plugin.json", "examples/**", "Cargo.toml", "Cargo.lock", "README.md"]

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
shlex = "2.0.1"
rustpython-parser = "0.4.0"
rustpython-ast = { version = "0.4.0", features = ["visitor"] }

[dev-dependencies]
libc = "=0.2.191"

[[test]]
name = "session_verifier"
path = "tests/session_verifier.rs"
harness = false
